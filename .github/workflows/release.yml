name: fxXL Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fxxl-stable-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      upstream_commit: ${{ steps.check.outputs.upstream_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate fxXL release identity
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < FXXL_VERSION)
          UPSTREAM_COMMIT=$(tr -d '[:space:]' < UPSTREAM_BASE)
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::FXXL_VERSION is not strict SemVer"
            exit 1
          fi
          if ! [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::UPSTREAM_BASE must contain one full Git commit"
            exit 1
          fi
          TAG="fxxl-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=${UPSTREAM_COMMIT}" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} already exists; no release needed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} will be published from ${GITHUB_SHA}"
          fi

  test:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Test
        run: zig build test -Doptimize=ReleaseSafe
      - name: Test installer
        run: sh scripts/test-setup.sh

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/fx-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/fx LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "fx-${{ matrix.name }}.tar.gz" -C "$package_dir" fx LICENSE THIRD_PARTY_NOTICES.md
          sha256sum "fx-${{ matrix.name }}.tar.gz" > "fx-${{ matrix.name }}.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fx-${{ matrix.name }}
          path: |
            fx-${{ matrix.name }}.tar.gz
            fx-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [check-version, test, build-linux]
    if: needs.check-version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fx-linux-*
          merge-multiple: true
      - name: Verify assets and create manifest
        env:
          FXXL_VERSION: ${{ needs.check-version.outputs.version }}
          UPSTREAM_COMMIT: ${{ needs.check-version.outputs.upstream_commit }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check fx-linux-x86_64.tar.gz.sha256
          sha256sum --check fx-linux-aarch64.tar.gz.sha256
          jq -n \
            --arg version "$FXXL_VERSION" \
            --arg upstream_commit "$UPSTREAM_COMMIT" \
            --arg source_commit "$GITHUB_SHA" \
            '{schema_version: 1, version: $version, upstream_commit: $upstream_commit, source_commit: $source_commit}' \
            > manifest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: fxXL ${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            manifest.json
            fx-linux-x86_64.tar.gz
            fx-linux-x86_64.tar.gz.sha256
            fx-linux-aarch64.tar.gz
            fx-linux-aarch64.tar.gz.sha256
